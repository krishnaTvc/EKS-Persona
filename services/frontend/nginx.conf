worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 8k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # entrypoint.sh fills this from /etc/resolv.conf for Docker or Kubernetes.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    resolver_timeout 3s;
    limit_req_zone $binary_remote_addr zone=registrations:1m rate=10r/m;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"frontend"}';
        }
        location /api/ {
            limit_req zone=registrations burst=20 nodelay;
            limit_req_status 429;
            set $registration http://registration:8000;
            proxy_pass $registration$request_uri;
            add_header Cache-Control no-store always;
        }
        location /media/ {
            set $media http://media:8000;
            proxy_pass $media$request_uri;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
